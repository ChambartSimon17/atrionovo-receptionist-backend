info:
  name: Get Available Slots
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/businesses/{{businessId}}/massage-availability?date=2026-11-02&serviceId=REPLACE_WITH_SERVICE_ID"
  auth: inherit

runtime:
  variables:
    - name: businessId
      value: REPLACE_WITH_MASSAGE_BUSINESS_ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
