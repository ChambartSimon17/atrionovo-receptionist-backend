info:
  name: Get Appointment Counts of a Month
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/businesses/{{businessId}}/appointments/month?year=2026&month=11"
  auth: inherit

runtime:
  variables:
    - name: businessId
      value: REPLACE_WITH_MASSAGE_BUSINESS_ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
