info:
  name: Get Appointments of a Day
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/businesses/{{businessId}}/appointments?date=2026-11-02"
  auth: inherit

runtime:
  variables:
    - name: businessId
      value: REPLACE_WITH_MASSAGE_BUSINESS_ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
