info:
  name: Deactivate Massage Service
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/businesses/{{businessId}}/massage-services/{{serviceId}}"
  auth: inherit

runtime:
  variables:
    - name: businessId
      value: REPLACE_WITH_MASSAGE_BUSINESS_ID
    - name: serviceId
      value: REPLACE_WITH_SERVICE_ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
