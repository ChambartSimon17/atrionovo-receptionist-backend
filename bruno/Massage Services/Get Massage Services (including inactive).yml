info:
  name: Get Massage Services (including inactive)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/businesses/{{businessId}}/massage-services?includeInactive=true"
  auth: inherit

runtime:
  variables:
    - name: businessId
      value: REPLACE_WITH_MASSAGE_BUSINESS_ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
