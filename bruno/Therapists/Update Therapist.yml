info:
  name: Update Therapist
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/businesses/{{businessId}}/therapists/{{therapistId}}"
  body:
    type: json
    data: |-
      {
        "serviceIds": ["REPLACE_WITH_SERVICE_ID"]
      }
  auth: inherit

runtime:
  variables:
    - name: businessId
      value: REPLACE_WITH_MASSAGE_BUSINESS_ID
    - name: therapistId
      value: REPLACE_WITH_ID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
