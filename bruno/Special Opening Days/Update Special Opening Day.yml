info:
  name: Update Special Opening Day
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/restaurants/{{restaurantId}}/special-opening-days/{{specialOpeningDayId}}"
  body:
    type: json
    data: |-
      {
        "date": "2026-12-25",
        "isClosed": true,
        "openingPeriods": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
