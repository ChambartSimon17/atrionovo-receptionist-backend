info:
  name: Create Special Opening Day
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/restaurants/{{restaurantId}}/special-opening-days"
  body:
    type: json
    data: |-
      {
        "date": "2026-12-24",
        "isClosed": false,
        "openingPeriods": [
          {
            "opensAtMinutes": 720,
            "closesAtMinutes": 900
          }
        ]
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: specialOpeningDayId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
