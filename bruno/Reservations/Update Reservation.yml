info:
  name: Update Reservation
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/reservations/{{reservationid}}"
  body:
    type: json
    data: |-
      {
        "restaurantId": "{{restaurantId}}",
        "firstName": "Simon",
        "lastName": "Chambart",
        "phoneNumber": "+32470123456",
        "email": "simon@example.com",
        "guestCount": 4,
        "startTime": "2026-08-17T15:30:00.000Z",
        "notes": "Window seat"
      }
  auth: inherit

runtime:
  variables:
    - name: restaurantId
      value: cmsx40oy30000s01nzviohyxu

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
