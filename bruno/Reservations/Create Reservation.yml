info:
  name: Create Reservation
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/reservations"
  body:
    type: json
    data: |-
      {
        "restaurantId": "{{restaurantId}}",
        "firstName": "Simon",
        "lastName": "Chambart",
        "phoneNumber": "+32470123456",
        "email": "simon@example.com",
        "guestCount": 1,
        "startTime": "2026-08-03T15:15:00.000Z",
        "notes": "Window seat"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: reservationid
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
