info:
  name: Create Reservation
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/reservations"
  body:
    type: json
    data: |-
      {
        "restaurantId": "{{restaurantId}}",
        "firstName": "Rollback",
        "lastName": "Test",
        "phoneNumber": "+32470999999",
        "email": "rollback@test.com",
        "guestCount": 2,
        "startTime": "2026-09-21T16:15:00.000Z",
        "notes": "test transaction"
      }
  auth: inherit

runtime:
  variables:
    - name: restaurantId
      value: cmsx40oy30000s01nzviohyxu
  scripts:
    - type: tests
      code: |-
        const response = res.getBody();

        bru.setVar(
          "reservationId",
          response.data.id
        );

        bru.setVar(
          "phoneNumber",
          response.data.phoneNumber
        );
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: reservationid
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
