info:
  name: Find Upcoming Reservations
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/reservations/upcoming?restaurantId={{restaurantId}}&phoneNumber=+32470123456"
  params:
    - name: restaurantId
      value: "{{restaurantId}}"
      type: query
    - name: phoneNumber
      value: "+32470123456"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
