info:
  name: Check Availability
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/reservations/check-availability"
  body:
    type: json
    data: |-
      {
        "restaurantId": "{{restaurantId}}",
        "guestCount": 2,
        "startTime": "2026-12-24T12:00:00.000Z",
        "endTime": "2026-12-24T12:00:00.000Z"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
