info:
  name: Update Customer
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/customers/{{customerId}}"
  body:
    type: json
    data: |-
      {
        "restaurantId": "{{restaurantId}}",
        "firstName": "Simon",
        "lastName": "Chambart",
        "phoneNumber": "0470123456",
        "email": "SIMON@ICLOUD.COM",
        "notes": "Always prefers terrace",
        "isVip": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
