info:
  name: Find Customer
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/customers/search?restaurantId={{restaurantId}}&phoneNumber={{phoneNumber}}"
  params:
    - name: restaurantId
      value: "{{restaurantId}}"
      type: query
    - name: phoneNumber
      value: "{{phoneNumber}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
