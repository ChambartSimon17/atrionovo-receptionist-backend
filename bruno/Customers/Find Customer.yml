info:
  name: Find Customer
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/customers/search?businessId={{businessId}}&phoneNumber={{phoneNumber}}"
  params:
    - name: businessId
      value: "{{businessId}}"
      type: query
    - name: phoneNumber
      value: "{{phoneNumber}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
