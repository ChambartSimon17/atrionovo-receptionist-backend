info:
  name: Overlapping Periods
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/restaurants/{{restaurantId}}/opening-hours"
  body:
    type: json
    data: |-
      {
        "openingHours": [
          {
            "dayOfWeek": "MONDAY",
            "opensAtMinutes": 720,
            "closesAtMinutes": 900
          },
          {
            "dayOfWeek": "MONDAY",
            "opensAtMinutes": 840,
            "closesAtMinutes": 1080
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
